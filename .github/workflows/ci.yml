name: CI
# `wip/**`: ramos de trabalho passam pelo CI antes de a `main` avançar (a Vercel só publica a `main`).
on: { pull_request: {}, push: { branches: [main, 'wip/**'] } }
permissions: { contents: read }
jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run arch
      - run: npm run test
      - run: npm run audit
  build-e2e:
    runs-on: ubuntu-latest
    needs: qualidade
    permissions: { contents: write } # só para publicar as capturas no ramo ci-capturas
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - uses: supabase/setup-cli@v3
      - run: npm ci
      # Banco local e descartável: aplica supabase/migrations e cria o usuário de teste. Sem segredos.
      - run: supabase start
      - name: Ambiente E2E (Supabase local)
        run: bash scripts/e2e-env.sh | sed "s/^export //; s/'//g" >> "$GITHUB_ENV"
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Os testes de fluxo rodam sozinhos; as capturas (pesadas: ~50 telas com axe) vêm depois, para não disputar
      # o mesmo servidor e gerar lentidão que vira falha falsa nos testes de tempo.
      - run: npm run test:e2e -- --grep-invert capturas
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: falhas-e2e, path: test-results/, if-no-files-found: ignore, retention-days: 5 }
      - run: npx playwright test e2e/zz-capturas.spec.ts --project=mobile-390 --project=tablet-768 --project=desktop-1280
      # Capturas das telas principais, para conferir o visual sem precisar rodar o app
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: capturas, path: capturas/, if-no-files-found: ignore, retention-days: 7 }
      # Nos ramos de trabalho, as capturas também vão para o ramo `ci-capturas` (sobrescrito a cada execução),
      # para poderem ser vistas direto pelo git antes de a `main` avançar.
      - name: Publica capturas no ramo ci-capturas
        if: always() && startsWith(github.ref, 'refs/heads/wip/')
        run: |
          [ -d capturas ] || exit 0
          cd capturas
          git init -q -b ci-capturas
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "capturas ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-capturas
      - run: npx lhci autorun
  rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
      - run: supabase start
      - run: supabase test db
